name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch supersedes the running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm test -- --run && npm run build

  docker-smoke:
    # runs alongside the unit tests: the image build dominates the wall time even from the layer cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the PyTorch image is large)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: voice-trainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name app -p 8001:8000 -e VT_OFFLINE=1 -v "$PWD/ci-data:/data" voice-trainer:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8001/api/health && break; sleep 2; done
          curl -sf http://localhost:8001/api/health
          docker exec app python -c "import piper, piper.train.vits.lightning, torch; print('piper + torch', torch.__version__)"
      - name: Smoke-test the UI with Playwright
        run: |
          docker run --rm --network host -v "$PWD/tests/e2e:/e2e" mcr.microsoft.com/playwright:v1.52.0-noble \
            sh -c "cd /tmp && npm init -y >/dev/null && npm i -s playwright@1.52.0 >/dev/null && cp /e2e/smoke.js /tmp/smoke.js && node /tmp/smoke.js"
      - name: Container logs
        if: always()
        run: docker logs app
